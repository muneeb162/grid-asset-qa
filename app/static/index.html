<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid asset register</title>
<style>
  :root {
    --ink: #17202A;
    --muted: #4F5D66;
    --paper: #F2F4F3;
    --surface: #FFFFFF;
    --rule: #C9D1CE;
    --cable: #12507A;
    --ok: #1F7A4D;     --ok-bg: #E3F2EA;
    --warn: #8A5700;   --warn-bg: #FFF1D6;
    --down: #A3221B;   --down-bg: #FDE7E5;
    --font: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--font); }
  header { background: var(--surface); border-bottom: 1px solid var(--rule); padding: 20px 24px 16px; }
  h1 { margin: 0 0 12px; font-size: 1.5rem; font-weight: 600; }
  h2 { margin: 0 0 12px; font-size: 1.125rem; font-weight: 600; }

  /* The one memorable element: the network status bar, drawn like a load gauge */
  .load { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--rule); max-width: 640px; }
  .load span { transition: flex-grow .3s ease; }
  .load .ok { background: var(--ok); } .load .warn { background: #D99A1E; } .load .down { background: var(--down); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 8px; color: var(--muted); font-size: .875rem; }
  .legend b { color: var(--ink); font-variant-numeric: tabular-nums; }

  main { display: grid; grid-template-columns: minmax(260px, 320px) 1fr; gap: 24px; padding: 24px; align-items: start; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  section { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 20px; min-width: 0; }

  label { display: block; font-size: .875rem; font-weight: 600; margin: 12px 0 4px; }
  input, select, textarea { width: 100%; padding: 8px 10px; font: inherit; color: inherit; border: 1px solid #9AA8A3; border-radius: 4px; background: #fff; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { font: inherit; font-weight: 600; border-radius: 4px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--cable); background: var(--cable); color: #fff; }
  button.quiet { background: #fff; color: var(--cable); padding: 4px 10px; font-size: .875rem; }
  :focus-visible { outline: 3px solid #5FA8D3; outline-offset: 2px; }
  form button[type=submit] { margin-top: 16px; width: 100%; }

  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 4px; font-size: .875rem; }
  .msg:empty { display: none; }
  .msg.error { background: var(--down-bg); color: var(--down); }
  .msg.success { background: var(--ok-bg); color: var(--ok); }
  .msg ul { margin: 4px 0 0; padding-left: 18px; }

  .toolbar { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar label { margin: 0 0 4px; }
  .toolbar select { width: auto; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .9375rem; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  th { font-size: .8125rem; color: var(--muted); font-weight: 600; }
  td.num { font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: .8125rem; font-weight: 600; }
  .badge.in_service { background: var(--ok-bg); color: var(--ok); }
  .badge.maintenance { background: var(--warn-bg); color: var(--warn); }
  .badge.out_of_service { background: var(--down-bg); color: var(--down); }
  .empty { color: var(--muted); padding: 24px 8px; }

  dialog { border: 1px solid var(--rule); border-radius: 6px; padding: 20px; width: min(420px, 92vw); }
  dialog::backdrop { background: rgba(23, 32, 42, .35); }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .load span { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>Grid asset register</h1>
  <div class="load" data-testid="load-bar" aria-hidden="true">
    <span class="ok"></span><span class="warn"></span><span class="down"></span>
  </div>
  <div class="legend" data-testid="summary">
    <span>In service <b data-testid="count-in_service">0</b></span>
    <span>Maintenance <b data-testid="count-maintenance">0</b></span>
    <span>Out of service <b data-testid="count-out_of_service">0</b></span>
  </div>
</header>

<main>
  <section aria-labelledby="add-heading">
    <h2 id="add-heading">Add asset</h2>
    <form id="asset-form" data-testid="asset-form" novalidate>
      <label for="name">Name</label>
      <input id="name" name="name" placeholder="TR Hörde 04" required>

      <label for="type">Type</label>
      <select id="type" name="type">
        <option value="transformer">Transformer</option>
        <option value="cable">Cable</option>
        <option value="substation">Substation</option>
        <option value="switchgear">Switchgear</option>
      </select>

      <label for="voltage_kv">Voltage (kV)</label>
      <input id="voltage_kv" name="voltage_kv" type="number" step="0.1" placeholder="10">

      <div class="row">
        <div><label for="latitude">Latitude</label><input id="latitude" name="latitude" type="number" step="any" placeholder="51.49"></div>
        <div><label for="longitude">Longitude</label><input id="longitude" name="longitude" type="number" step="any" placeholder="7.51"></div>
      </div>

      <label for="commissioned_on">Commissioned on</label>
      <input id="commissioned_on" name="commissioned_on" type="date">

      <button type="submit">Add asset</button>
      <div class="msg" id="form-msg" data-testid="form-msg" role="status" aria-live="polite"></div>
    </form>
  </section>

  <section aria-labelledby="list-heading">
    <div class="toolbar">
      <h2 id="list-heading" style="margin:0">Assets</h2>
      <div>
        <label for="status-filter">Show</label>
        <select id="status-filter" data-testid="status-filter">
          <option value="">All statuses</option>
          <option value="in_service">In service</option>
          <option value="maintenance">Maintenance</option>
          <option value="out_of_service">Out of service</option>
        </select>
      </div>
    </div>
    <div class="table-wrap">
      <table data-testid="asset-table">
        <thead><tr><th>Name</th><th>Type</th><th>Voltage</th><th>Level</th><th>Status</th><th><span class="visually-hidden">Actions</span></th></tr></thead>
        <tbody id="asset-rows"></tbody>
      </table>
    </div>
    <div class="msg" id="list-msg" data-testid="list-msg" role="status" aria-live="polite"></div>
  </section>
</main>

<dialog id="outage-dialog" data-testid="outage-dialog" aria-labelledby="outage-heading">
  <form method="dialog" id="outage-form">
    <h2 id="outage-heading">Report outage</h2>
    <p id="outage-asset" style="margin:0;color:var(--muted)"></p>
    <label for="outage-description">What happened?</label>
    <textarea id="outage-description" rows="3" placeholder="Cable fault after excavation work"></textarea>
    <div class="msg" id="outage-msg" data-testid="outage-msg"></div>
    <div class="dialog-actions">
      <button type="button" class="quiet" id="outage-cancel">Cancel</button>
      <button type="submit" id="outage-submit">Report outage</button>
    </div>
  </form>
</dialog>

<script>
const STATUS_LABEL = { in_service: "In service", maintenance: "Maintenance", out_of_service: "Out of service" };
const TYPE_LABEL = { transformer: "Transformer", cable: "Cable", substation: "Substation", switchgear: "Switchgear" };
let outageTargetId = null;

async function api(path, options = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  const body = res.status === 204 ? null : await res.json();
  if (!res.ok) throw body;
  return body;
}

function showMessage(el, kind, text, items = []) {
  el.className = "msg " + kind;
  el.textContent = text;
  if (items.length) {
    const ul = document.createElement("ul");
    items.forEach(i => { const li = document.createElement("li"); li.textContent = i; ul.appendChild(li); });
    el.appendChild(ul);
  }
}

function errorItems(err) {
  return (err && err.errors ? err.errors : []).map(e => `${e.field.replace(/_/g, " ")}: ${e.message}`);
}

async function refresh() {
  const filter = document.getElementById("status-filter").value;
  const [all, visible, openOutages] = await Promise.all([
    api("/api/assets"),
    api("/api/assets" + (filter ? `?status=${filter}` : "")),
    api("/api/outages?open_only=true"),
  ]);
  const outageByAsset = Object.fromEntries(openOutages.map(o => [o.asset_id, o.id]));

  const counts = { in_service: 0, maintenance: 0, out_of_service: 0 };
  all.forEach(a => counts[a.status]++);
  Object.entries(counts).forEach(([k, v]) => document.querySelector(`[data-testid=count-${k}]`).textContent = v);
  const bar = document.querySelectorAll(".load span");
  [counts.in_service, counts.maintenance, counts.out_of_service].forEach((v, i) => bar[i].style.flexGrow = v);

  const tbody = document.getElementById("asset-rows");
  tbody.innerHTML = "";
  if (!visible.length) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td colspan="6" class="empty" data-testid="empty-state"></td>`;
    tr.firstChild.textContent = all.length ? "No assets with this status." : "No assets yet. Add the first one with the form.";
    tbody.appendChild(tr);
    return;
  }
  for (const a of visible) {
    const tr = document.createElement("tr");
    tr.dataset.testid = "asset-row";
    tr.dataset.assetId = a.id;
    const cells = [a.name, TYPE_LABEL[a.type], `${a.voltage_kv} kV`, a.voltage_level];
    cells.forEach((text, i) => { const td = document.createElement("td"); td.textContent = text; if (i === 2) td.className = "num"; tr.appendChild(td); });

    const statusTd = document.createElement("td");
    statusTd.innerHTML = `<span class="badge ${a.status}" data-testid="status-badge"></span>`;
    statusTd.firstChild.textContent = STATUS_LABEL[a.status];
    tr.appendChild(statusTd);

    const actionTd = document.createElement("td");
    const btn = document.createElement("button");
    btn.className = "quiet";
    if (outageByAsset[a.id]) {
      btn.textContent = "Mark resolved";
      btn.dataset.testid = "resolve-btn";
      btn.onclick = () => resolveOutage(outageByAsset[a.id]);
    } else {
      btn.textContent = "Report outage";
      btn.dataset.testid = "report-btn";
      btn.onclick = () => openOutageDialog(a);
    }
    actionTd.appendChild(btn);
    tr.appendChild(actionTd);
    tbody.appendChild(tr);
  }
}

document.getElementById("asset-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  const num = v => (v === "" ? null : Number(v));
  const payload = {
    name: f.name.value, type: f.type.value,
    voltage_kv: num(f.voltage_kv.value), latitude: num(f.latitude.value), longitude: num(f.longitude.value),
    commissioned_on: f.commissioned_on.value || null,
  };
  const msg = document.getElementById("form-msg");
  try {
    const asset = await api("/api/assets", { method: "POST", body: JSON.stringify(payload) });
    showMessage(msg, "success", `Added ${asset.name}.`);
    f.reset();
    await refresh();
  } catch (err) {
    showMessage(msg, "error", err.detail || "The asset could not be added.", errorItems(err));
  }
});

function openOutageDialog(asset) {
  outageTargetId = asset.id;
  document.getElementById("outage-asset").textContent = asset.name;
  document.getElementById("outage-description").value = "";
  document.getElementById("outage-msg").textContent = "";
  document.getElementById("outage-msg").className = "msg";
  document.getElementById("outage-dialog").showModal();
}

document.getElementById("outage-cancel").onclick = () => document.getElementById("outage-dialog").close();

document.getElementById("outage-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const payload = {
    asset_id: outageTargetId,
    started_at: new Date().toISOString(),
    description: document.getElementById("outage-description").value,
  };
  try {
    await api("/api/outages", { method: "POST", body: JSON.stringify(payload) });
    document.getElementById("outage-dialog").close();
    showMessage(document.getElementById("list-msg"), "success", "Outage reported.");
    await refresh();
  } catch (err) {
    showMessage(document.getElementById("outage-msg"), "error", err.detail || "The outage could not be reported.", errorItems(err));
  }
});

async function resolveOutage(outageId) {
  const msg = document.getElementById("list-msg");
  try {
    await api(`/api/outages/${outageId}/resolve`, { method: "PATCH", body: JSON.stringify({ resolved_at: new Date().toISOString() }) });
    showMessage(msg, "success", "Outage resolved.");
    await refresh();
  } catch (err) {
    showMessage(msg, "error", err.detail || "The outage could not be resolved.");
  }
}

document.getElementById("status-filter").addEventListener("change", refresh);
refresh();
</script>
</body>
</html>
