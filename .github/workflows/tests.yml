name: tests

on:
  push:
  pull_request:

jobs:
  unit-and-api:
    name: Unit and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Smoke tests (fail fast)
        run: pytest -m smoke -q

      - name: Full unit and API suite with coverage gate
        run: >
          pytest -m "not e2e"
          --cov=app --cov-report=term-missing --cov-report=html:reports/coverage
          --junitxml=reports/junit.xml
          --html=reports/test-report.html --self-contained-html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-api-reports
          path: reports/

  e2e:
    name: End-to-end tests (Playwright)
    needs: unit-and-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium

      - name: Browser tests
        run: >
          pytest -m e2e
          --tracing retain-on-failure --screenshot only-on-failure
          --html=reports/e2e-report.html --self-contained-html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-reports
          path: |
            reports/
            test-results/
